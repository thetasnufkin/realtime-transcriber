[project]
name = "realtime-transcriber"
version = "0.1.0"
description = "Fully local real-time Japanese transcription (faster-whisper + Silero VAD)"
requires-python = ">=3.12"
dependencies = [
    "audiotsm>=0.1.2",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "sounddevice>=0.5.6",
    "tomli-w>=1.2.0",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.1",
]

[project.scripts]
realtime-transcriber = "realtime_transcriber.cli:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "ruff>=0.16.10",
    "soxr>=1.1.0",
]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "windows"]
timeout = 30  # 字幕を待ち続けて止まるテストを失敗にする（TestClient の待ちはシグナルで割り込めない）
timeout_method = "thread"
