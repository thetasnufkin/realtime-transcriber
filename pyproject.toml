[project]
name = "realtime-transcriber"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "audiotsm>=0.1.2",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9,<10",
    "sounddevice>=0.5.6",
    "websockets>=17.1",
]

[project.scripts]
realtime-transcriber = "realtime_transcriber:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
